name: Assemble and Release

on:
  repository_dispatch:
    types:
      - assemble-release

  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main
        type: choice
        options:
          - main
          - dev

concurrency:
  group: release-${{ github.event.client_payload.branch || inputs.branch }}
  cancel-in-progress: true

jobs:
  release:
    name: Release

    permissions:
      contents: write
      id-token: write
      attestations: write

    runs-on: ubuntu-latest

    steps:
      - name: Determine build target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            branch="$DISPATCH_BRANCH"
            sha="$DISPATCH_SHA"
          else
            branch="$MANUAL_BRANCH"
            sha=""
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha || steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Compute tag
        id: version
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          v=$(grep -E '^version\s*=' gradle.properties | sed 's/.*=[[:space:]]*//')

          if [ -z "$v" ]; then
            echo "Could not read 'version' from gradle.properties"
            exit 1
          fi

          suffix="release"

          if [ "$BRANCH" = "dev" ]; then
            suffix="pre"
          fi

          base="v${v}-${suffix}"

          git fetch --tags --force

          if ! git rev-parse "refs/tags/${base}" >/dev/null 2>&1; then
            tag="$base"
          else
            n=$(git tag -l "${base}.*" \
              | sed -n "s|^${base}\.\([0-9]\+\)$|\1|p" \
              | sort -n \
              | tail -1)

            tag="${base}.$(( ${n:-0} + 1 ))"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Disable Environment Check
        run: |
          file=patches/src/main/kotlin/app/morphe/patches/shared/misc/checks/BaseCheckEnvironmentPatch.kt
          perl -i -pe 'BEGIN{$c=0} $c += s/^\s*invokeCheck\(\)\n//; END{die "Pattern not found in $ARGV\n" unless $c}' "$file"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          prerelease=""

          if [ "$BRANCH" = "dev" ]; then
            prerelease="--prerelease"
          fi

          gh release create "$TAG" \
            patches/build/libs/patches-*.mpp \
            --title "$TAG" \
            --generate-notes \
            $prerelease

      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: "Morphe Patches ${{ steps.version.outputs.tag }}"
          subject-path: patches/build/libs/patches-*.mpp
